    <noscript>
      Este site precisa de JavaScript habilitado para funcionar corretamente.
    </noscript>

    <!-- Section Principal -->
    <!-- É aqui onde o usuario configura a conversão -->
    <section id="home" class="center">
      <!-- Onde procura a imagem -->
      <label for="input-imagem" id="campo-arquivo">
        <svg><use href="#icon-nuvem-upload" /></svg>
        <p id="nome-arquivo">Click para procurar a imagem</p>

        <img
          id="preview-upload"
          src="data:image/gif;base64,R0lGODlhAQABAAAAACwAAAAAAQABAAA="
          loading="lazy"
          decoding="async"
        />
      </label>
      <input
        type="file"
        accept="image/*"
        id="input-imagem"
        style="display: none"
      />

      <!-- inputs-container -->
      <div id="container">
        <div id="escala-container">
          <svg><use href="#icon-lupa" /></svg>
          <span>Escala</span>
          <input
            id="escala-input"
            type="range"
            max="100"
            min="1"
            value="100"
            oninput="out.value = this.value + '%'"
          />
          <output class="porcentagem-texto" id="out">100%</output>
        </div>
        <!-- Escala container FIM -->

        <div id="resolucao-container">
          <svg><use href="#icon-image" /></svg>
          <span>resolução</span>
          <input
            id="resolucao-input"
            type="range"
            max="100"
            min="1"
            value="100"
            oninput="outR.value = this.value + '%'"
          />
          <output class="porcentagem-texto" id="outR">100%</output>
        </div>
        <!-- Resolucao container FIM -->
      </div>

      <!-- Botões para escolher o formato de saida -->
      <div id="saida-container">
        <h2>Saida</h2>

        <div id="btns-container">
          <label id="webp-label" for="webp">webp</label>
          <input type="radio" name="tipo-saida" id="webp" checked />

          <label id="jpeg-label" for="jpeg">jpeg</label>
          <input type="radio" name="tipo-saida" id="jpeg" />

          <label id="png-label" for="png">png</label>
          <input type="radio" name="tipo-saida" id="png" />

          <label id="avif-label" for="avif">avif</label>
          <input type="radio" name="tipo-saida" id="avif" />
        </div>
      </div>

      <button id="converter-btn">
        <svg><use href="#icon-play" /></svg> Converter
      </button>
    </section>

    <!-- Section Preview -->
    <!-- É aqui que a imagem aparecerá -->
    <section id="preview" class="">
      <a href="" id="download-btn">
        <svg focusable="false" aria-hidden="true">
          <use href="#icon-download" />
        </svg>
      </a>

      <div id="comparacao-peso">
        <span class="antes">0000kb</span>
        <svg focusable="false" aria-hidden="true">
          <use href="#icon-seta" />
        </svg>
        <span class="depois">----</span>
      </div>

      <div id="comparacao-tipo-arquivo">
        <span class="antes">---</span>
        <svg focusable="false" aria-hidden="true">
          <use href="#icon-seta" />
        </svg>
        <span class="depois">----</span>
      </div>

      <div id="comparacao-px">
        <span class="antes">0000px</span>
        <svg focusable="false" aria-hidden="true">
          <use href="#icon-seta" />
        </svg>
        <span class="depois">----</span>
      </div>

      <input type="range" id="comparacao-input" value="50" min="0" max="100" />

      <div id="imagem-container">
        <img id="img-original" src="" loading="lazy" decoding="async" />

        <img
          id="img-preview"
          src="CARREGANDO..."
          loading="lazy"
          decoding="async"
        />
      </div>
    </section>

    <script type="module" src="assets/js/main.js"></script>
